<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Επικοινωνήστε με την Eminidis Projects για κατασκευές και ανακαινίσεις στη Θεσσαλονίκη.">
  <title>Επικοινωνία | Eminidis Projects</title>
  <link rel="icon" type="image/png" href="assets/logoUrlZoom.png?v=logoUrl2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=black9">
  <link rel="stylesheet" href="responsive.css?v=black10">
  <link rel="stylesheet" href="pages.css?v=black37">
  <script defer src="script.js?v=language21"></script>
</head>
<body data-page="contact">
  <div class="site-shell">
    <header class="site-header" id="top">
      <a class="brand" href="/" aria-label="Eminidis Projects, αρχική"><img class="brand-logo" src="assets/logo.PNG?v=logo2" alt="Eminidis Projects"></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span><b data-i18n="menuToggle">ΜΕΝΟΥ</b></button>
      <nav class="site-nav" id="site-nav" aria-label="Κύρια πλοήγηση">
        <a href="/" data-i18n="navHome">Αρχική</a>
        <a href="/erga" data-i18n="navProjects">Έργα</a>
        <a href="/anakainiseis" data-i18n="navRenovations">Ανακαινίσεις</a>
        <a class="nav-cta is-active" href="/epikoinwnia" data-i18n="navContact">Επικοινωνία</a>
        <div class="language-select" data-language-menu>
          <button class="language-toggle" type="button" data-language-toggle aria-haspopup="true" aria-expanded="false" aria-label="Επιλογή γλώσσας">
            <span data-language-current>ΕΛ</span>
            <span class="language-chevron" aria-hidden="true"></span>
          </button>
          <div class="language-options" data-language-options role="menu">
            <button type="button" data-language-option="en" role="menuitem">EN</button>
          </div>
        </div>
      </nav>
    </header>

    <main class="page-main contact-page">
      <section class="contact-page-title" aria-labelledby="contact-title">
        <h1 id="contact-title" data-i18n="contactPageTitle">Επικοινωνία</h1>
      </section>

      <section class="content-band">
        <div class="contact-layout">
          <div class="contact-methods">
            <div class="contact-method">
              <span data-i18n="contactAddressLabel">Διεύθυνση</span>
              <p>Παστέρ 10<br>Πολίχνη Θεσσαλονίκης</p>
            </div>
            <div class="contact-method">
              <span data-i18n="contactPhoneLabel">Τηλέφωνο</span>
              <div class="contact-phone-stack">
                <a href="tel:+306972694121">+30 6972694121</a>
                <a href="tel:+306978615392">+30 6978615392</a>
              </div>
            </div>
            <div class="contact-method">
              <span data-i18n="contactEmailLabel">Email</span>
              <a href="mailto:info@nextgenconstr.gr">info@nextgenconstr.gr</a>
            </div>
          </div>

          <form class="contact-form" data-contact-form novalidate>
            <div class="field">
              <label for="name" data-i18n="contactNameLabel">Ονοματεπώνυμο *</label>
              <input id="name" name="name" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="email" data-i18n="contactFormEmailLabel">Email *</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="phone" data-i18n="contactFormPhoneLabel">Τηλέφωνο</label>
              <input id="phone" name="phone" autocomplete="tel">
            </div>
            <div class="field">
              <label for="message" data-i18n="contactMessageLabel">Το μήνυμά σας *</label>
              <textarea id="message" name="message" required></textarea>
            </div>
            <button class="button button-light" type="submit" data-i18n="contactSubmitButton">Αποστολή μηνύματος</button>
            <p class="form-status" data-form-status role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer"><a class="brand" href="/" aria-label="Eminidis Projects, αρχική"><img class="brand-logo" src="assets/logo.PNG?v=logo2" alt="Eminidis Projects"></a><div class="footer-contact" aria-label="Στοιχεία επικοινωνίας" data-i18n-aria-label="footerContactAria"><div class="footer-contact-item footer-phone-item"><span class="footer-contact-label" data-i18n="footerPhoneLabel">Τηλ. Επικοινωνίας</span><div class="footer-phone-stack"><a class="footer-contact-value" href="tel:+306972694121">+30 6972694121</a><a class="footer-contact-value" href="tel:+306978615392">+30 6978615392</a></div></div><div class="footer-contact-item"><span class="footer-contact-label" data-i18n="footerEmailLabel">Email</span><a class="footer-contact-value" href="mailto:info@eminidis.gr">info@eminidis.gr</a></div></div><a class="footer-top" href="#top" data-i18n="footerTop">ΠΙΣΩ ΣΤΗΝ ΑΡΧΗ</a></footer><small class="page-rights" data-i18n="footerRights">© 2026 All rights reserved.</small>
  </div>
</body>
</html>
