<body data-page="contact">
  <div class="site-shell">
    <header class="site-header" id="top">
      <a class="brand" href="/en/" aria-label="Eminidis Construction, home"><img class="brand-logo" src="/assets/logo.PNG?v=logo3" alt="Eminidis Construction"></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span><b data-i18n="menuToggle">MENU</b></button>
      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <a href="/en/" data-i18n="navHome">Home</a>
        <a href="/en/projects/" data-i18n="navProjects">Projects</a>
        <a href="/en/renovations/" data-i18n="navRenovations">Renovations</a>
        <a class="nav-cta is-active" href="/en/contact/" data-i18n="navContact">Contact</a>
        <div class="language-select" data-language-menu>
          <button class="language-toggle" type="button" data-language-toggle aria-haspopup="true" aria-expanded="false" aria-label="Choose language">
            <span data-language-current>EN</span>
            <span class="language-chevron" aria-hidden="true"></span>
          </button>
          <div class="language-options" data-language-options role="menu">
            <button type="button" data-language-option="el" role="menuitem">ΕΛ</button>
          </div>
        </div>
      </nav>
    </header>

    <main class="page-main contact-page">
      <section class="content-band contact-page-content" aria-label="Contact" data-i18n-aria-label="contactPageTitle">
        <div class="contact-layout">
          <form class="contact-form" data-contact-form novalidate>
            <div class="contact-honeypot" aria-hidden="true">
              <label for="company">Company</label>
              <input id="company" name="company" tabindex="-1" autocomplete="off">
            </div>
            <div class="field">
              <label for="name" data-i18n="contactNameLabel">Full name *</label>
              <input id="name" name="name" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="email" data-i18n="contactFormEmailLabel">Email *</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="phone" data-i18n="contactFormPhoneLabel">Phone</label>
              <input id="phone" name="phone" autocomplete="tel">
            </div>
            <div class="field">
              <label for="message" data-i18n="contactMessageLabel">Your message *</label>
              <textarea id="message" name="message" required></textarea>
            </div>
            <button class="button button-light" type="submit" data-i18n="contactSubmitButton">Send message</button>
            <p class="form-status" data-form-status role="status" aria-live="polite"></p>
          </form>

          <div class="contact-side">
            <div class="contact-methods">
              <div class="contact-method">
                <span data-i18n="contactEmailLabel">Email</span>
                <a href="mailto:info@eminidis.gr">info@eminidis.gr</a>
              </div>
              <div class="contact-method">
                <span data-i18n="contactPhoneLabel">Phone</span>
                <div class="contact-phone-stack">
                  <a href="tel:+306972694121">+30 6972694121</a>
                  <a href="tel:+306978615392">+30 6978615392</a>
                </div>
              </div>
              <div class="contact-method">
                <span data-i18n="contactAddressLabel">Address</span>
                <p>10 Pasteur Street<br>Polichni, Thessaloniki</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer"><a class="brand" href="/en/" aria-label="Eminidis Construction, home"><img class="brand-logo" src="/assets/logo.PNG?v=logo3" alt="Eminidis Construction"></a><div class="footer-contact" aria-label="Contact details" data-i18n-aria-label="footerContactAria"><div class="footer-contact-item footer-phone-item"><span class="footer-contact-label" data-i18n="footerPhoneLabel">Phone</span><div class="footer-phone-stack"><a class="footer-contact-value" href="tel:+306972694121">+30 6972694121</a><a class="footer-contact-value" href="tel:+306978615392">+30 6978615392</a></div></div><div class="footer-contact-item"><span class="footer-contact-label" data-i18n="footerEmailLabel">Email</span><a class="footer-contact-value" href="mailto:info@eminidis.gr">info@eminidis.gr</a></div></div><a class="footer-top" href="#top" data-i18n="footerTop">BACK TO TOP</a></footer><small class="page-rights" data-i18n="footerRights">© 2026 All rights reserved.</small>
  </div>
</body>
</html>
